name: Node bindings

# Tests bindings/node, builds its binaries, and checks the packed package
# installs and works on each OS. A `node-v<version>` tag also publishes it.

on:
  push:
    branches: [main]
    # Tag pushes skip the path filters.
    tags: ["node-v*"]
    paths:
      - bindings/node/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - tools/probe/ci/with-noise-source.sh
      - .github/workflows/node.yml
  pull_request:
    paths:
      - bindings/node/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - tools/probe/ci/with-noise-source.sh
      - .github/workflows/node.yml

# Pushing to a PR again cancels the run for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests the fake-microphone build under Node, Bun and Deno, then builds the
  # shipped binaries. Linux builds in Ubuntu 22.04 so it needs only glibc 2.35.
  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { name: Windows, os: windows-latest, targets: "x86_64-pc-windows-msvc,aarch64-pc-windows-msvc" }
          - { name: Linux x64, os: ubuntu-24.04, container: "ubuntu:22.04", targets: x86_64-unknown-linux-gnu }
          - { name: Linux arm64, os: ubuntu-24.04-arm, container: "ubuntu:22.04", targets: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
        working-directory: bindings/node
    env:
      # Node 22's own minimum.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # No Visual C++ Redistributable needed.
      RUSTFLAGS: ${{ matrix.name == 'Windows' && '-C target-feature=+crt-static' || '' }}
      TARGETS: ${{ matrix.targets }}
    steps:
      - name: Install build tools and ALSA headers (Linux)
        if: matrix.container
        working-directory: .
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git pkg-config unzip libasound2-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The action's `targets` option doesn't work on Windows.
      - run: rustup target add ${TARGETS//,/ }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      # Same result on every OS.
      - if: matrix.name == 'Linux x64'
        run: cargo clippy -p handy-recorder-node --features test-backend --all-targets -- -D warnings
      - if: matrix.name == 'Linux x64'
        run: npm run typecheck
      - run: npm run build:test
      # All three run even if one fails.
      - name: Test (Node, Bun, Deno)
        run: |
          failed=0
          node test/run.mjs || failed=1
          node test/run.mjs --runtime bun || failed=1
          node test/run.mjs --runtime "deno run -A" || failed=1
          exit $failed
      - name: Build the binaries we ship
        run: |
          for target in ${TARGETS//,/ }; do
            npm run build -- --target "$target"
          done
          ls -l prebuilds
      - name: Check the binaries need at most glibc 2.35 (Linux)
        if: runner.os == 'Linux'
        run: |
          for file in prebuilds/*.node; do
            newest=$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
            echo "$(basename "$file"): $newest"
            [ "$(printf '%s\n' "$newest" GLIBC_2.35 | sort -V | tail -n1)" = GLIBC_2.35 ]
          done
      # These exist only on macOS 14.2+, so they must be weak (see build.rs)
      # for the binary to load on older macOS.
      - name: Check CoreAudio is weak-linked (macOS)
        if: runner.os == 'macOS'
        run: |
          for file in prebuilds/*.node; do
            symbols=$(nm -m "$file" | grep -E "AudioHardware(Create|Destroy)ProcessTap")
            echo "$symbols"
            if grep -v weak <<<"$symbols"; then
              echo "$(basename "$file"): the functions above are not weak-linked" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}
          path: bindings/node/prebuilds/*.node
          if-no-files-found: error

  # One .tgz with all six binaries, as `npm publish` would make it.
  package:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: bindings/node/prebuilds
          merge-multiple: true
      - name: Exactly the six binaries native.js loads
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc; do
            test -f "prebuilds/recorder.$target.node" || { echo "missing recorder.$target.node"; exit 1; }
          done
          test "$(ls prebuilds/*.node | wc -l)" -eq 6
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: bindings/node/*.tgz

  # Installs the .tgz with each package manager (scripts off) and runs
  # test/smoke.mjs; then records real audio where the runner can fake a mic.
  package-check:
    name: Package (${{ matrix.name }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm, combos: "npm:node" }
          - { name: Linux x64, os: ubuntu-24.04 }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: '!matrix.combos'
      - uses: denoland/setup-deno@v2
        if: '!matrix.combos'
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Install and smoke test
        run: |
          if [ "${{ matrix.name }}" = "Windows arm64" ]; then test "$(node -p process.arch)" = arm64; fi
          bindings/node/test/ci/package-matrix.sh "$RUNNER_TEMP/package" "$RUNNER_TEMP/smoke" ${{ matrix.combos }}

      # BlackHole loops its output back to its input; no reboot needed.
      - name: Record from BlackHole (macOS)
        if: runner.os == 'macOS'
        env:
          HANDY_RECORDER_SMOKE_DEVICE: BlackHole
        run: |
          brew install blackhole-2ch switchaudio-osx
          sudo killall coreaudiod || true
          for _ in $(seq 30); do SwitchAudioSource -a -t input | grep -q BlackHole && break; sleep 1; done
          SwitchAudioSource -t output -s "BlackHole 2ch"
          node bindings/node/test/ci/tone.mjs "$RUNNER_TEMP/tone.wav"
          afplay "$RUNNER_TEMP/tone.wav" &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 1
          cd "$RUNNER_TEMP/smoke/npm" && node smoke.mjs
      # x64 Node under Rosetta: the only place the darwin-x64 binary loads.
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 22
          architecture: x64
      - name: Smoke test the x64 binary under Rosetta (macOS)
        if: runner.os == 'macOS'
        run: |
          test "$(node -p process.arch)" = x64
          out=$(cd "$RUNNER_TEMP/smoke/npm" && node smoke.mjs)
          echo "$out"
          grep -q "darwin-x64" <<<"$out"

      - name: Record from PulseAudio (Linux x64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        env:
          HANDY_RECORDER_SMOKE_DEVICE: default
        run: |
          sudo apt-get update && sudo apt-get install -y pulseaudio pulseaudio-utils
          cd "$RUNNER_TEMP/smoke/npm"
          "$GITHUB_WORKSPACE/tools/probe/ci/with-noise-source.sh" node smoke.mjs
      # Other distributions in Docker; expectations are in distro-check.sh.
      - name: Distributions (Linux x64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          # check <image> <expectation> [setup command]
          check() {
            docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/package:/package:ro" "$1" \
              sh -c "${3:-true} && { command -v bash >/dev/null || apk add --no-cache bash >/dev/null; } && bash /repo/bindings/node/test/ci/distro-check.sh $2 /package" \
              | tee /dev/stderr | grep '^RESULT' >>"$GITHUB_STEP_SUMMARY"
          }
          echo "### Distributions" >>"$GITHUB_STEP_SUMMARY"
          alsa="apt-get update >/dev/null && apt-get install -y libasound2 >/dev/null"
          failed=0
          check node:18-bookworm-slim ok "$alsa" || failed=1  # oldest supported Node
          check node:24-trixie-slim ok "$alsa" || failed=1    # newest Node; libasound2 is libasound2t64 here
          check node:22-bookworm-slim alsa || failed=1        # no libasound2: the install hint
          check node:22-alpine no-prebuild || failed=1        # musl: no binary yet
          exit $failed

  # Publishes the .tgz package-check tested, through npm trusted publishing:
  # no token, and provenance is automatic. npm's trusted publisher for the
  # package names this repository and workflow file (node.yml).
  publish:
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: [package, package-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Publish
        run: |
          tgz=$(ls handy-computer-recorder-*.tgz)
          version=$(tar -xOzf "$tgz" package/package.json | jq -r .version)
          if [ "node-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match package version $version"
            exit 1
          fi
          # A prerelease (0.1.0-beta.1) mustn't become `latest`.
          case "$version" in
            *-*) npm publish "$tgz" --tag next ;;
            *) npm publish "$tgz" ;;
          esac
